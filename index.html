<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POV Kartları - Hangi Senaryoda Nasılsın?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.bunny.net/css?family=playfair-display:700|inter:300,400,500,600,700" rel="stylesheet">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --dark: #2d3436;
            --light: #dfe6e9;
            --gold: #fdcb6e;
            --card-bg: rgba(255, 255, 255, 0.95);
            --glass: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #1a1a2e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        /* Stars Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.5); }
        }

        /* Curtain Animation */
        .curtain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            pointer-events: none;
        }

        .curtain-left, .curtain-right {
            width: 50%;
            height: 100%;
            position: relative;
            transition: transform 2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .curtain-left {
            background: linear-gradient(90deg, #8b0000 0%, #c0392b 40%, #e74c3c 70%, #c0392b 90%, #8b0000 100%);
            transform-origin: left center;
            border-right: 3px solid #fdcb6e;
        }

        .curtain-right {
            background: linear-gradient(90deg, #8b0000 0%, #c0392b 10%, #e74c3c 30%, #c0392b 60%, #8b0000 100%);
            transform-origin: right center;
            border-left: 3px solid #fdcb6e;
        }

        .curtain-left::before, .curtain-right::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                180deg,
                transparent,
                transparent 20px,
                rgba(0,0,0,0.1) 20px,
                rgba(0,0,0,0.1) 22px
            );
        }

        .curtain-left::after, .curtain-right::after {
            content: '';
            position: absolute;
            top: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #fdcb6e 0%, #f39c12 50%, #fdcb6e 100%);
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
        }

        .curtain-left::after { right: 0; }
        .curtain-right::after { left: 0; }

        .curtain-open .curtain-left {
            transform: translateX(-100%);
        }

        .curtain-open .curtain-right {
            transform: translateX(100%);
        }

        .curtain-container.hidden {
            display: none;
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header */
        .site-header {
            text-align: center;
            padding: 40px 20px 20px;
            opacity: 0;
            transform: translateY(-30px);
            transition: all 1s ease 1.5s;
        }

        .site-header.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .site-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            background: linear-gradient(135deg, #fdcb6e, #f39c12, #fd79a8, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: none;
        }

        .site-subtitle {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Category Selection */
        .category-screen {
            display: none;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .category-screen.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .category-card {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(253, 121, 168, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(253, 203, 110, 0.5);
            box-shadow: 0 20px 60px rgba(108, 92, 231, 0.3), 0 0 30px rgba(253, 121, 168, 0.1);
        }

        .category-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .category-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #fdcb6e;
        }

        .category-desc {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        .category-count {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 15px;
            background: rgba(108, 92, 231, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--secondary);
        }

        .random-category-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
        }

        .random-category-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.6);
        }

        /* Card Game Screen */
        .game-screen {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .game-screen.active {
            display: block;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .game-category-label {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 500;
        }

        .game-counter {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Card Stack */
        .card-stack {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 500px;
            margin: 20px auto;
            perspective: 1000px;
        }

        .question-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            padding: 35px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.3s;
            touch-action: none;
        }

        .question-card:active {
            cursor: grabbing;
        }

        .question-card.card-1 {
            background: linear-gradient(145deg, #1e1e3f, #2d2d5e);
            border: 1px solid rgba(253, 203, 110, 0.3);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5), 0 0 40px rgba(108, 92, 231, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 5;
        }

        .question-card.card-2 {
            background: linear-gradient(145deg, #1a1a35, #252550);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            z-index: 4;
            transform: scale(0.95) translateY(15px);
        }

        .question-card.card-3 {
            background: linear-gradient(145deg, #151530, #202045);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            z-index: 3;
            transform: scale(0.9) translateY(30px);
        }

        .card-number {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .card-category-tag {
            position: absolute;
            top: 20px;
            right: 25px;
            padding: 4px 12px;
            background: rgba(108, 92, 231, 0.3);
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--secondary);
        }

        .card-emoji {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .card-question {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            margin-bottom: 20px;
        }

        .card-tag {
            padding: 6px 16px;
            background: linear-gradient(135deg, rgba(253, 121, 168, 0.2), rgba(108, 92, 231, 0.2));
            border: 1px solid rgba(253, 121, 168, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        /* Swipe Indicators */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .swipe-like {
            right: 20px;
            color: #00b894;
            border: 2px solid #00b894;
            background: rgba(0, 184, 148, 0.1);
        }

        .swipe-nope {
            left: 20px;
            color: #e17055;
            border: 2px solid #e17055;
            background: rgba(225, 112, 85, 0.1);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            transform: scale(1.15);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-nope {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: #fff;
        }

        .btn-random {
            background: linear-gradient(135deg, var(--gold), #f39c12);
            color: #2d3436;
            width: 55px;
            height: 55px;
            font-size: 1.2rem;
        }

        .btn-like {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: #fff;
        }

        /* Saved Cards */
        .saved-section {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .saved-section.active {
            display: block;
        }

        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .saved-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--gold);
        }

        .saved-list {
            display: grid;
            gap: 15px;
        }

        .saved-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        .saved-item:hover {
            border-color: rgba(253, 203, 110, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .saved-item-question {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .saved-item-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 10px;
            background: rgba(108, 92, 231, 0.2);
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--secondary);
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 0;
        }

        /* Progress bar */
        .progress-bar-custom {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* Toast notification */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 12px 25px;
            background: rgba(0, 184, 148, 0.9);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
        }

        /* End screen */
        .end-screen {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .end-screen.active {
            display: block;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .end-emoji {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .end-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .end-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        .restart-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.5);
        }

        /* Responsive */
        @media (max-width: 576px) {
            .card-stack {
                height: 450px;
            }

            .question-card {
                padding: 25px 20px;
            }

            .category-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                gap: 15px;
            }

            .end-stats {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        /* Confetti */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 9998;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Stars Background -->
    <div class="stars" id="stars"></div>

    <!-- Curtain -->
    <div class="curtain-container" id="curtain">
        <div class="curtain-left"></div>
        <div class="curtain-right"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Header -->
        <header class="site-header" id="siteHeader">
            <h1 class="site-title">🎭 POV Kartları</h1>
            <p class="site-subtitle">Hangi senaryoda nasıl tepki verirsin? Keşfet!</p>
        </header>

        <!-- Category Selection -->
        <section class="category-screen" id="categoryScreen">
            <div class="text-center mb-4">
                <h2 style="font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.8rem;">Bir Kategori Seç</h2>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.95rem;">Kartları sağa kaydırarak kaydet, sola kaydırarak geç</p>
            </div>
            <div class="category-grid" id="categoryGrid"></div>
            <button class="random-category-btn" onclick="selectRandomCategory()">
                <i class="bi bi-shuffle me-2"></i>Rastgele Kategori Seç
            </button>
        </section>

        <!-- Game Screen -->
        <section class="game-screen" id="gameScreen">
            <div class="game-header">
                <button class="back-btn" onclick="goBack()">
                    <i class="bi bi-arrow-left me-1"></i>Geri
                </button>
                <span class="game-category-label" id="gameCategoryLabel"></span>
                <span class="game-counter" id="gameCounter"></span>
            </div>
            <div class="progress-bar-custom">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="card-stack" id="cardStack"></div>
            <div class="action-buttons">
                <button class="action-btn btn-nope" onclick="swipeCard('left')" title="Geç">
                    <i class="bi bi-x-lg"></i>
                </button>
                <button class="action-btn btn-random" onclick="randomQuestion()" title="Rastgele Soru">
                    <i class="bi bi-shuffle"></i>
                </button>
                <button class="action-btn btn-like" onclick="swipeCard('right')" title="Kaydet">
                    <i class="bi bi-heart-fill"></i>
                </button>
            </div>
        </section>

        <!-- Saved Section -->
        <section class="saved-section" id="savedSection">
            <div class="saved-header">
                <h3 class="saved-title"><i class="bi bi-heart-fill me-2" style="color: var(--accent);"></i>Kaydedilenler</h3>
                <button class="back-btn" onclick="goBack()"><i class="bi bi-arrow-left me-1"></i>Geri</button>
            </div>
            <div class="saved-list" id="savedList"></div>
        </section>

        <!-- End Screen -->
        <section class="end-screen" id="endScreen">
            <div class="end-emoji">🎉</div>
            <h2 class="end-title">Tüm Kartlar Tamamlandı!</h2>
            <div class="end-stats">
                <div class="stat-item">
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Toplam Soru</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statSaved">0</div>
                    <div class="stat-label">Kaydedilen</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statSkipped">0</div>
                    <div class="stat-label">Geçilen</div>
                </div>
            </div>
            <button class="restart-btn" onclick="goBack()"><i class="bi bi-arrow-repeat me-2"></i>Tekrar Oyna</button>
            <button class="restart-btn" onclick="viewSaved()" style="background: linear-gradient(135deg, #00b894, #00cec9);"><i class="bi bi-heart-fill me-2"></i>Kaydedilenleri Gör</button>
        </section>
    </div>

    <!-- Toast -->
    <div class="toast-notification" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Questions Data
        const categories = [
            {
                id: 1,
                name: "Günlük Hayatın Hafif Absürt Senaryoları",
                icon: "🎬",
                desc: "POV: Markette kartın reddediliyor, asansörde kapıyı tutar mısın? Günlük hayatın komik anları!",
                color: "#6c5ce7",

        // State

        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (2 + Math.random() * 3) + 's';
                starsContainer.appendChild(star);
            }
        }

        function openCurtain() {
            const curtain = document.getElementById('curtain');
            curtain.classList.add('curtain-open');
            playCurtainSound();
            
            setTimeout(() => {
                curtain.classList.add('hidden');
                document.getElementById('siteHeader').classList.add('visible');
                setTimeout(() => {
                    showCategories();
                }, 500);
            }, 2200);
        }

        function playCurtainSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Create a warm, cinematic chord
                const frequencies = [261.63, 329.63, 392.00, 523.25]; // C major chord
                const duration = 2.5;
                
                frequencies.forEach((freq, i) => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
                    
                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.3 + i * 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    
                    oscillator.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start(audioCtx.currentTime + i * 0.15);
                    oscillator.stop(audioCtx.currentTime + duration);
                });

                // Add a subtle shimmer
                const shimmer = audioCtx.createOscillator();
                const shimmerGain = audioCtx.createGain();
                shimmer.type = 'triangle';
                shimmer.frequency.setValueAtTime(1046.5, audioCtx.currentTime);
                shimmerGain.gain.setValueAtTime(0, audioCtx.currentTime);
                shimmerGain.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.8);
                shimmerGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
                shimmer.connect(shimmerGain);
                shimmerGain.connect(audioCtx.destination);
                shimmer.start(audioCtx.currentTime + 0.5);
                shimmer.stop(audioCtx.currentTime + 2.5);
            } catch(e) {
                console.log('Audio not supported');
            }
        }

        function playCardSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                if (type === 'save') {
                    oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(783.99, audioCtx.currentTime + 0.15);
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                } else {
                    oscillator.frequency.setValueAtTime(392, audioCtx.currentTime);
                    oscillator.frequency.linearRampToValueAtTime(261.63, audioCtx.currentTime + 0.15);
                    oscillator.type = 'sine';
                    gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                }
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function showCategories() {
            const screen = document.getElementById('categoryScreen');
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';
            
            categories.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.style.animationDelay = (index * 0.1) + 's';
                card.innerHTML = `
                    <span class="category-icon">${cat.icon}</span>
                    <h3 class="category-name">${cat.name}</h3>
                    <p class="category-desc">${cat.desc}</p>
                    <span class="category-count">${cat.questions.length} soru</span>
                `;
                card.onclick = () => selectCategory(cat.id);
                grid.appendChild(card);
            });
            
            setTimeout(() => {
                screen.classList.add('visible');
            }, 100);
        }

        function selectCategory(id) {
            currentCategory = categories.find(c => c.id === id);
            currentQuestions = [...currentCategory.questions];
            currentIndex = 0;
            savedCards = [];
            skippedCount = 0;
            
            document.getElementById('categoryScreen').classList.remove('visible');
            setTimeout(() => {
                document.getElementById('categoryScreen').style.display = 'none';
                startGame();
            }, 400);
        }

        function selectRandomCategory() {
            const randomIndex = Math.floor(Math.random() * categories.length);
            selectCategory(categories[randomIndex].id);
            showToast('🎲 Rastgele kategori seçildi!');
        }

        function startGame() {
            const gameScreen = document.getElementById('gameScreen');
            gameScreen.classList.add('active');
            document.getElementById('gameCategoryLabel').textContent = currentCategory.icon + ' ' + currentCategory.name;
            renderCards();
            updateCounter();
        }

        function renderCards() {
            const stack = document.getElementById('cardStack');
            stack.innerHTML = '';
            
            const remaining = currentQuestions.slice(currentIndex);
            if (remaining.length === 0) {
                showEndScreen();
                return;
            }
            
            // Render up to 3 cards
            for (let i = Math.min(2, remaining.length - 1); i >= 0; i--) {
                const q = remaining[i];
                const card = document.createElement('div');
                const cardClass = i === 0 ? 'card-1' : i === 1 ? 'card-2' : 'card-3';
                card.className = `question-card ${cardClass}`;
                card.innerHTML = `
                    <span class="card-number">#${currentIndex + i + 1}</span>
                    <span class="card-category-tag">${q.tag}</span>
                    <div class="card-emoji">${q.emoji}</div>
                    <p class="card-question">${q.text}</p>
                    <span class="card-tag">${q.tag}</span>
                    <div class="swipe-indicator swipe-like">KAYDET ✓</div>
                    <div class="swipe-indicator swipe-nope">GEÇ ✗</div>
                `;
                
                if (i === 0) {
                    setupDrag(card);
                }
                
                stack.appendChild(card);
            }
        }

        function setupDrag(card) {
            let startXPos = 0;
            let currentXPos = 0;
            let isDraggingCard = false;

            const onStart = (e) => {
                isDraggingCard = true;
                startXPos = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                card.style.transition = 'none';
                activeCard = card;
            };

            const onMove = (e) => {
                if (!isDraggingCard) return;
                e.preventDefault();
                currentXPos = (e.type.includes('mouse') ? e.clientX : e.touches[0].clientX) - startXPos;
                
                const rotation = currentXPos * 0.1;
                card.style.transform = `translateX(${currentXPos}px) rotate(${rotation}deg)`;
                
                // Show indicators
                const likeIndicator = card.querySelector('.swipe-like');
                const nopeIndicator = card.querySelector('.swipe-nope');
                
                if (currentXPos > 50) {
                    likeIndicator.style.opacity = Math.min((currentXPos - 50) / 100, 1);
                    nopeIndicator.style.opacity = 0;
                    card.style.borderColor = `rgba(0, 184, 148, ${Math.min((currentXPos - 50) / 100, 0.5)})`;
                } else if (currentXPos < -50) {
                    nopeIndicator.style.opacity = Math.min((-currentXPos - 50) / 100, 1);
                    likeIndicator.style.opacity = 0;
                    card.style.borderColor = `rgba(225, 112, 85, ${Math.min((-currentXPos - 50) / 100, 0.5)})`;
                } else {
                    likeIndicator.style.opacity = 0;
                    nopeIndicator.style.opacity = 0;
                    card.style.borderColor = 'rgba(253, 203, 110, 0.3)';
                }
            };

            const onEnd = () => {
                if (!isDraggingCard) return;
                isDraggingCard = false;
                card.style.transition = 'transform 0.4s ease, border-color 0.3s';
                
                if (currentXPos > 120) {
                    card.style.transform = `translateX(${window.innerWidth}px) rotate(30deg)`;
                    card.style.opacity = '0';
                    setTimeout(() => swipeCard('right'), 300);
                } else if (currentXPos < -120) {
                    card.style.transform = `translateX(-${window.innerWidth}px) rotate(-30deg)`;
                    card.style.opacity = '0';
                    setTimeout(() => swipeCard('left'), 300);
                } else {
                    card.style.transform = '';
                    card.style.borderColor = 'rgba(253, 203, 110, 0.3)';
                    const likeInd = card.querySelector('.swipe-like');
                    const nopeInd = card.querySelector('.swipe-nope');
                    if (likeInd) likeInd.style.opacity = 0;
                    if (nopeInd) nopeInd.style.opacity = 0;
                }
                currentXPos = 0;
            };

            card.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            card.addEventListener('touchstart', onStart, { passive: true });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        function swipeCard(direction) {
            if (currentIndex >= currentQuestions.length) return;
            
            const question = currentQuestions[currentIndex];
            
            if (direction === 'right') {
                savedCards.push(question);
                playCardSound('save');
                showToast('💚 Kart kaydedildi!');
            } else {
                skippedCount++;
                playCardSound('skip');
            }
            
            currentIndex++;
            updateCounter();
            
            setTimeout(() => {
                renderCards();
            }, 100);
        }

        function randomQuestion() {
            if (currentIndex >= currentQuestions.length) return;
            
            // Pick a random remaining question and swap with current
            const remaining = currentQuestions.length - currentIndex;
            if (remaining <= 1) return;
            
            const randomOffset = Math.floor(Math.random() * remaining);
            const temp = currentQuestions[currentIndex];
            currentQuestions[currentIndex] = currentQuestions[currentIndex + randomOffset];
            currentQuestions[currentIndex + randomOffset] = temp;
            
            renderCards();
            showToast('🎲 Rastgele soru seçildi!');
            
            // Add a little animation
            const stack = document.getElementById('cardStack');
            stack.style.transform = 'scale(0.95) rotate(2deg)';
            setTimeout(() => {
                stack.style.transform = '';
                stack.style.transition = 'transform 0.3s ease';
            }, 150);
        }

        function updateCounter() {
            const counter = document.getElementById('gameCounter');
            counter.textContent = `${currentIndex} / ${currentQuestions.length}`;
            
            const progress = (currentIndex / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showEndScreen() {
            document.getElementById('gameScreen').classList.remove('active');
            const endScreen = document.getElementById('endScreen');
            endScreen.classList.add('active');
            
            document.getElementById('statTotal').textContent = currentQuestions.length;
            document.getElementById('statSaved').textContent = savedCards.length;
            document.getElementById('statSkipped').textContent = skippedCount;
            
            // Confetti
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#fdcb6e', '#6c5ce7', '#fd79a8', '#00b894', '#e17055', '#00cec9'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = (5 + Math.random() * 10) + 'px';
                confetti.style.height = (5 + Math.random() * 10) + 'px';
                document.body.appendChild(confetti);
                
                const duration = 2 + Math.random() * 3;
                const xDrift = (Math.random() - 0.5) * 200;
                
                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${xDrift}px, 100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });
                
                setTimeout(() => confetti.remove(), duration * 1000);
            }
        }

        function goBack() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('endScreen').classList.remove('active');
            document.getElementById('savedSection').classList.remove('active');
            
            const catScreen = document.getElementById('categoryScreen');
            catScreen.style.display = 'block';
            setTimeout(() => catScreen.classList.add('visible'), 50);
        }

        function viewSaved() {
            document.getElementById('endScreen').classList.remove('active');
            const savedSection = document.getElementById('savedSection');
            savedSection.classList.add('active');
            
            const list = document.getElementById('savedList');
            list.innerHTML = '';
            
            if (savedCards.length === 0) {
                list.innerHTML = '<p style="text-align:center; color: rgba(255,255,255,0.5); padding: 40px;">Henüz kaydedilen kart yok 🤷</p>';
                return;
            }
            
            savedCards.forEach((card, index) => {
                const item = document.createElement('div');
                item.className = 'saved-item';
                item.style.animationDelay = (index * 0.1) + 's';
                item.innerHTML = `
                    <div style="font-size: 1.5rem; margin-bottom: 8px;">${card.emoji}</div>
                    <p class="saved-item-question">${card.text}</p>
                    <span class="saved-item-tag">${card.tag}</span>
                `;
                list.appendChild(item);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
